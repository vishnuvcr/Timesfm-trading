name: Phase 4.2 nested regime-conditioned stock test

on:
  push:
    branches: [phase-4-equity]
  workflow_dispatch:

jobs:
  p42-nested-regime:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[p42-regime]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch Phase 2 adjusted stock cache
        run: |
          git fetch origin phase-2-data
          git checkout origin/phase-2-data -- configs/equity_research_universe.json data/cache/equities/tejhq_nse_adjusted
      - name: Fetch tested TimesFM 3.0 adapter and dependencies
        run: |
          git fetch origin phase-3-timesfm-gate
          git checkout origin/phase-3-timesfm-gate -- src/model requirements-research.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-research.txt
      - name: Cache TimesFM 3.0 model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: timesfm3-hf-${{ runner.os }}-3.0.2
      - name: Install pinned TimesFM 3.0 research environment
        run: python -m pip install -r requirements-research.txt
      - name: Syntax check nested regime experiment
        run: python -m py_compile scripts/stock_timesfm_regime_incremental_p42.py
      - name: Run nested regime-conditioned incremental test
        run: |
          PYTHONPATH=. python scripts/stock_timesfm_regime_incremental_p42.py             --data-dir data/cache/equities/tejhq_nse_adjusted             --output p4_p42_nested_results
      - name: Upload Phase 4.2 results
        uses: actions/upload-artifact@v4
        with:
          name: phase4-p42-nested-regime
          path: p4_p42_nested_results/
