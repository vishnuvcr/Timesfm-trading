name: Alternate NSE individual-stock acquisition

on:
  push:
    branches: [phase-2-data]
    paths:
      - configs/equity_research_universe.json
      - scripts/acquire_tejhq_equities.py
      - src/data/validate_equity_panel.py
      - .github/workflows/acquire-alternate-equities.yml
  workflow_dispatch:
    inputs:
      symbols:
        description: Comma-separated NSE symbols; blank = configured bootstrap universe
        required: false
        default: ""
        type: string
      refresh:
        description: Re-download even if cached files exist
        required: false
        default: false
        type: boolean

jobs:
  acquire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2-data
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests
      - name: Acquire cached EOD stock panel
        env:
          SYMBOLS: ${{ inputs.symbols }}
          REFRESH: ${{ inputs.refresh }}
        run: |
          args=()
          if [ -n "$SYMBOLS" ]; then args+=(--symbols "$SYMBOLS"); fi
          if [ "$REFRESH" = "true" ]; then args+=(--refresh); fi
          args+=(--actions)
          PYTHONPATH=. python scripts/acquire_tejhq_equities.py "${args[@]}"
      - name: Validate stock panel
        run: PYTHONPATH=. python src/data/validate_equity_panel.py
      - name: Commit cache and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/equities/tejhq_nse
          if git diff --cached --quiet; then
            echo "No cache changes."
            exit 0
          fi
          git commit -m "Cache alternate NSE individual-stock EOD panel"
          git push origin phase-2-data
