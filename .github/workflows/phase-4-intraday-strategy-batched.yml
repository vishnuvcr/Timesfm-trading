name: Phase 4 intraday TimesFM strategy matrix (batched)

on:
  push:
    branches: [phase-4-intraday-strategy]
  workflow_dispatch:

jobs:
  intraday-strategy-batched:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[p4-intraday-batched]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch tested TimesFM 3.0 adapter
        run: |
          git fetch origin phase-3-timesfm-gate
          git checkout origin/phase-3-timesfm-gate -- src/model requirements-research.txt
      - name: Restore validated intraday release cache
        id: data-cache
        uses: actions/cache@v4
        with:
          path: stocks_1m_csvs.zip
          key: nse-fno-1m-v1.0.0-20024713c455cc16b5daae91e06991d57a1acfa6a30c77bb7d5a742ee1789ab2
      - name: Download release on cache miss
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: |
          curl -L --fail --retry 4 --retry-all-errors -o stocks_1m_csvs.zip             https://github.com/voletiramu/nse-fno-1min-data/releases/download/v1.0.0/stocks_1m_csvs.zip
      - name: Verify release digest
        run: |
          echo "20024713c455cc16b5daae91e06991d57a1acfa6a30c77bb7d5a742ee1789ab2  stocks_1m_csvs.zip" | sha256sum -c -
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research.txt
      - name: Cache TimesFM 3.0 model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: timesfm3-hf-3.0.2-${{ runner.os }}
      - name: Install pinned research environment
        run: python -m pip install -r requirements-research.txt
      - name: Syntax check
        run: python -m py_compile scripts/phase4_intraday_strategy_batched.py
      - name: Run batched predeclared intraday matrix
        run: |
          PYTHONPATH=. python scripts/phase4_intraday_strategy_batched.py             --zip stocks_1m_csvs.zip             --output p4_intraday_strategy_batched_results
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: phase4-intraday-timesfm-vwap-batched
          path: p4_intraday_strategy_batched_results/
