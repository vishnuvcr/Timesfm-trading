name: Alternate adjusted stock and PIT universe acquisition

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Comma-separated NSE symbols; blank = configured bootstrap universe
        required: false
        default: ""
        type: string
  push:
    branches: [phase-2-data]
    paths:
      - scripts/acquire_tejhq_adjusted_stock_panel.py
      - src/data/validate_adjusted_stock_panel.py
      - .github/workflows/acquire-queried-adjusted-stock-panel.yml

jobs:
  acquire:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[acquire-adjusted]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2-data
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pyarrow
      - name: Acquire adjusted stock panel and PIT universe
        env:
          SYMBOLS: ${{ inputs.symbols }}
        run: |
          args=()
          if [ -n "$SYMBOLS" ]; then args+=(--symbols "$SYMBOLS"); fi
          PYTHONPATH=. python scripts/acquire_tejhq_adjusted_stock_panel.py "${args[@]}"
      - name: Validate adjusted panel
        run: PYTHONPATH=. python src/data/validate_adjusted_stock_panel.py
      - name: Commit adjusted cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/equities/tejhq_nse_adjusted data/cache/equities/tejhq_nse_pit_universe.csv
          if git diff --cached --quiet; then
            echo "No cache changes."
            exit 0
          fi
          git commit -m "Cache TejHQ adjusted stock panel and PIT universe"
          git push origin phase-2-data
