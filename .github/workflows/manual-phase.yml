name: Phase 4 equity

on:
  push:
    branches: [phase-4-equity]
  workflow_dispatch:

jobs:
  strategy-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest numpy
      - name: Run strategy and risk tests
        run: PYTHONPATH=. python -m pytest -q tests/test_risk_engine.py
