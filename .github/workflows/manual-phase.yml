name: Phase 2 data

on:
  workflow_dispatch:

jobs:
  data-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Validate source registry
        run: python -m json.tool configs/source_registry.json >/dev/null
      - name: Validate dataset manifests
        run: python src/data/validate_manifest.py
      - name: Run data-layer tests
        run: python -m pytest -q
