name: Phase 5 options

on:
  pull_request:
  push:
    branches: [phase-5-options]
  workflow_dispatch:

jobs:
  options-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Run options research tests
        run: PYTHONPATH=. python -m pytest -q tests/test_options_research_rules.py
