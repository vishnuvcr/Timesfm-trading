name: Phase 7 cost backtest

on:
  workflow_dispatch:

jobs:
  cost-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate fee manifest
        run: python -m json.tool configs/fee_manifest_2026-09-20.json >/dev/null
      - name: Run fee manifest tests
        run: PYTHONPATH=. python -m pytest -q tests/test_fee_manifest.py
