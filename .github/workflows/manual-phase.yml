name: Phase 3 TimesFM 3.0 gate
# stock-p1 trigger marker v2

on:
  pull_request:
  push:
    branches: [phase-3-timesfm-gate]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies without weights
        run: python -m pip install --upgrade pip pytest numpy
      - name: Run statistics and adapter tests
        run: PYTHONPATH=. python -m pytest -q tests/test_timesfm3_adapter.py tests/test_forecast_metrics.py tests/test_statistical_tests.py

  p1-bootstrap-forecast:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[bootstrap-p1]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-research.txt
      - name: Cache Hugging Face model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: timesfm3-hf-${{ runner.os }}-3.0.2
      - name: Cache secondary P1 input
        uses: actions/cache@v4
        with:
          path: .cache/p1
          key: p1-nifty50-googlefinance-c73de0e6c9acca1330a19cd41ee3d7dbd5100260
      - name: Install pinned TimesFM 3 environment
        run: python -m pip install -r requirements-research.txt
      - name: Fetch secondary P1 input when cache is cold
        run: |
          mkdir -p .cache/p1
          if [ ! -f ".cache/p1/NIFTY_50(INDEX)from2000.csv" ]; then
            curl --fail --location "https://raw.githubusercontent.com/Gajapathy-Selvaraj/Stock_Market_Datasets_NSE/c73de0e6c9acca1330a19cd41ee3d7dbd5100260/NIFTY_50%28INDEX%29from2000.csv" -o ".cache/p1/NIFTY_50(INDEX)from2000.csv"
          fi
      - name: Record P1 input provenance
        run: |
          sha256sum ".cache/p1/NIFTY_50(INDEX)from2000.csv"
          wc -l ".cache/p1/NIFTY_50(INDEX)from2000.csv"
      - name: Run TimesFM 3.0 P1 exploratory bootstrap
        run: PYTHONPATH=. python scripts/bootstrap_timesfm3_p1.py --input ".cache/p1/NIFTY_50(INDEX)from2000.csv"
      - name: Upload exploratory results
        uses: actions/upload-artifact@v4
        with:
          name: phase3-p1-bootstrap
          path: p1_results/

  p1-multivariate-ablation:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ablation-p1]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-research.txt
      - name: Cache TimesFM 3.0 model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: timesfm3-hf-${{ runner.os }}-3.0.2
      - name: Cache secondary multivariate input
        uses: actions/cache@v4
        with:
          path: .cache/p1_multivar
          key: p1-multivar-nifty50-5series-c73de0e6c9acca1330a19cd41ee3d7dbd5100260
      - name: Install pinned TimesFM 3 environment
        run: python -m pip install -r requirements-research.txt
      - name: Fetch secondary 5-series input when cache is cold
        run: |
          mkdir -p .cache/p1_multivar
          base="https://raw.githubusercontent.com/Gajapathy-Selvaraj/Stock_Market_Datasets_NSE/c73de0e6c9acca1330a19cd41ee3d7dbd5100260"
          curl --fail --location "${base}/NIFTY_50%28INDEX%29from2000.csv" -o ".cache/p1_multivar/NIFTY_50(INDEX)from2000.csv"
          curl --fail --location "${base}/NSE_RELIANCE_from2000.csv" -o ".cache/p1_multivar/NSE_RELIANCE_from2000.csv"
          curl --fail --location "${base}/NSE_TCS_from2000.csv" -o ".cache/p1_multivar/NSE_TCS_from2000.csv"
          curl --fail --location "${base}/NSE_HDFCBANK_from2000.csv" -o ".cache/p1_multivar/NSE_HDFCBANK_from2000.csv"
          curl --fail --location "${base}/NSE_HINDUNILVR_from2000.csv" -o ".cache/p1_multivar/NSE_HINDUNILVR_from2000.csv"
      - name: Run 3.0 multivariate/covariate ablation
        run: |
          PYTHONPATH=. python scripts/bootstrap_timesfm3_p1_multivariate.py \
            --data-dir .cache/p1_multivar \
            --output p1_results/multivariate_ablation.json
      - name: Upload ablation result
        uses: actions/upload-artifact@v4
        with:
          name: phase3-p1-multivariate-ablation
          path: p1_results/multivariate_ablation.json

  model-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned TimesFM 3 environment
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-research.txt
      - name: Run TimesFM 3.0 synthetic multivariate smoke test
        run: python scripts/smoke_timesfm3.py

 
  p1-individual-stock-bootstrap:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[stock-p1]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch Phase 2 adjusted stock cache
        run: |
          git fetch origin phase-2-data
          git checkout origin/phase-2-data -- configs/equity_research_universe.json data/cache/equities/tejhq_nse_adjusted
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-research.txt
      - name: Cache TimesFM 3.0 model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: timesfm3-hf-${{ runner.os }}-3.0.2
      - name: Install pinned TimesFM 3 environment
        run: python -m pip install -r requirements-research.txt
      - name: Syntax check stock bootstrap
        run: python -m py_compile scripts/bootstrap_timesfm3_stocks_p1.py
      - name: Run individual-stock exploratory bootstrap
        run: |
          PYTHONPATH=. python scripts/bootstrap_timesfm3_stocks_p1.py \
            --data-dir data/cache/equities/tejhq_nse_adjusted \
            --symbols "RELIANCE,TCS,HDFCBANK,INFY,ICICIBANK,SBIN,ITC,BHARTIARTL,LT,AXISBANK,KOTAKBANK,HINDUNILVR,MARUTI,SUNPHARMA,BAJFINANCE,ASIANPAINT,TITAN,HCLTECH,WIPRO,ULTRACEMCO,NESTLEIND,M&M,NTPC,ONGC,POWERGRID,TATAMOTORS,TATASTEEL,ADANIENT,CIPLA,DRREDDY"
      - name: Upload stock bootstrap results
        uses: actions/upload-artifact@v4
        with:
          name: phase3-p1-individual-stock-bootstrap
          path: p3_stock_results/
