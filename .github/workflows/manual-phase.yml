name: Phase 8 paper live

on:
  pull_request:
  push:
    branches: [phase-8-paper-live]
  workflow_dispatch:

jobs:
  simulation-audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tests
        run: python -m pip install --upgrade pip pytest
      - name: Run simulation audit tests
        run: PYTHONPATH=. python -m pytest -q tests/test_simulation_audit.py
