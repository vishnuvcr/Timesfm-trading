name: Phase 3 TimesFM 3.0 gate

on:
  pull_request:
  push:
    branches: [phase-3-timesfm-gate]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies without weights
        run: python -m pip install --upgrade pip pytest numpy
      - name: Run statistics and adapter tests
        run: PYTHONPATH=. python -m pytest -q tests/test_timesfm3_adapter.py tests/test_forecast_metrics.py tests/test_statistical_tests.py

  p1-bootstrap-forecast:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[bootstrap-p1]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned TimesFM 3 environment
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-research.txt
      - name: Run official NIFTY 50 TRI P1 bootstrap
        run: PYTHONPATH=. python scripts/bootstrap_timesfm3_p1.py
      - name: Upload exploratory results
        uses: actions/upload-artifact@v4
        with:
          name: phase3-p1-bootstrap
          path: p1_results/

  model-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned TimesFM 3 environment
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-research.txt
      - name: Run TimesFM 3.0 synthetic multivariate smoke test
        run: python scripts/smoke_timesfm3.py
