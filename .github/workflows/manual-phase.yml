name: Phase 7 cost backtest

on:
  pull_request:
  push:
    branches: [phase-7-cost-backtest]
  workflow_dispatch:

jobs:
  cost-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Validate fee manifest
        run: python -m json.tool configs/fee_manifest_2026-09-20.json >/dev/null
      - name: Run cost-engine tests
        run: PYTHONPATH=. python -m pytest -q tests/test_cost_engine.py
