name: Phase 4B PIT 10-session validation

on:
  push:
    branches: [phase-4b-stock-multifrequency]
  workflow_dispatch:

jobs:
  pit-10d:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[p4b-pit-10d]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch Phase 2 stock cache and PIT universe
        run: |
          git fetch origin phase-2-data
          git checkout origin/phase-2-data -- data/cache/equities/tejhq_nse_adjusted data/cache/equities/tejhq_nse_pit_universe.csv configs/equity_research_universe.json
      - name: Fetch tested TimesFM 3.0 adapter and dependencies
        run: |
          git fetch origin phase-3-timesfm-gate
          git checkout origin/phase-3-timesfm-gate -- src/model requirements-research.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research.txt
      - name: Cache TimesFM 3.0 model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: timesfm3-hf-${{ runner.os }}-3.0.2
      - name: Install pinned research environment
        run: python -m pip install -r requirements-research.txt
      - name: Syntax check
        run: python -m py_compile scripts/stock_timesfm_pit_10d_p4b.py
      - name: Run PIT 10-session validation
        run: |
          PYTHONPATH=. python scripts/stock_timesfm_pit_10d_p4b.py             --data-dir data/cache/equities/tejhq_nse_adjusted             --pit-universe data/cache/equities/tejhq_nse_pit_universe.csv             --output p4b_pit_10d_results
      - name: Upload PIT validation results
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-pit-10d-validation
          path: p4b_pit_10d_results/
