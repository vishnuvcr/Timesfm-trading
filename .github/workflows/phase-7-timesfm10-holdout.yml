name: Phase 7 TimesFM10 post-selection holdout

on:
  push:
    branches: [phase-7-cost-backtest]
  workflow_dispatch:

jobs:
  timesfm10-holdout:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[p7-timesfm10]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch Phase 2 stock data
        run: |
          git fetch origin phase-2-data
          git checkout origin/phase-2-data -- data/cache/equities/tejhq_nse_adjusted data/cache/equities/tejhq_nse data/cache/equities/tejhq_nse_pit_universe.csv configs/equity_research_universe.json
      - name: Fetch tested TimesFM 3.0 adapter
        run: |
          git fetch origin phase-3-timesfm-gate
          git checkout origin/phase-3-timesfm-gate -- src/model requirements-research.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research.txt
      - name: Cache TimesFM 3.0 model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: timesfm3-hf-${{ runner.os }}-3.0.2
      - name: Install pinned TimesFM 3 research environment
        run: python -m pip install -r requirements-research.txt
      - name: Syntax check
        run: python -m py_compile scripts/phase7_timesfm10_holdout.py
      - name: Run frozen 2023+ TimesFM10 holdout
        run: |
          PYTHONPATH=. python scripts/phase7_timesfm10_holdout.py             --adjusted-dir data/cache/equities/tejhq_nse_adjusted             --raw-dir data/cache/equities/tejhq_nse             --pit-universe data/cache/equities/tejhq_nse_pit_universe.csv             --output p7_timesfm10_holdout_results
      - name: Upload Phase 7 holdout results
        uses: actions/upload-artifact@v4
        with:
          name: phase7-timesfm10-post-selection-holdout
          path: p7_timesfm10_holdout_results/
